<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: 'self'; font-src 'none'; connect-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="财务档案">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf7">
<title>财务档案</title>
<style></style>
<style>/* 财务档案 v1.4 · 一套样式
 * 参照苹果官网的做法：系统字体（苹方 / 雅黑）、少量字号、无阴影无边框、靠留白和浅底色分区、
 * 一种强调色只给主按钮和链接、胶囊形只给按钮。画作当作满宽主图。 */
:root {
  --bg: #fbfaf7; --bg-2: #f3f1ec; --bg-3: #ecebe6; --white: #fff;
  --ink: #1d1d1f; --ink-2: #424245; --mute: #6e6e73;
  --hair: #e6e4df; --hair-2: #d2d0ca;
  --accent: #2f5242; --accent-hover: #24412f; --accent-soft: #e6ece7;
  --amber: #8f6413; --neg: #b03d27; --neg-bg: rgba(176, 61, 39, .14);
  --gold: #b48c45; --river: #6a8c9b; --cypress: #48685a; --terra: #ad694b; --cherry: #d99aab;
  --f-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC", "PingFang SC", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro SC", "PingFang SC", "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --f-num: var(--f-sans);
  --gap: 28px; --maxw: 1180px; --top: 48px; --sub: 52px;
  --r: 18px; --r-sm: 10px;
  /* 旧变量名，图表与脚本仍在引用 */
  --line: var(--hair); --line-2: var(--hair-2); --paper: var(--bg); --paper-2: var(--white);
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-sans); letter-spacing: 0; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; scroll-padding-top: calc(var(--top) + var(--sub) + 16px); -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.serif { font-weight: 600; }
.num { font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.neg { color: var(--neg); }
.dim { color: var(--mute); }
.r { text-align: right; }
.warn, .warn-inline { color: var(--neg); }
.warn-inline { font-size: 13px; }
.ok { color: var(--accent); }
.empty { color: var(--mute); text-align: center; padding: 20px; }
.sub { color: var(--mute); margin: 4px 0 0; font-size: 14px; }
.note { color: var(--ink-2); font-size: 14px; max-width: 70em; }

/* ---------- 按钮与链接：胶囊只给按钮 ---------- */
button { cursor: pointer; border: 0; background: var(--bg-3); color: var(--ink); border-radius: 980px; padding: 6px 16px; font-size: 14px; line-height: 1.45; transition: background .2s, color .2s; }
button:hover:not(:disabled) { background: #e3e1db; }
button:disabled { opacity: .35; cursor: default; }
button.primary { background: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); }
button.danger { background: var(--neg); color: #fff; }
button.ghost-danger { background: none; color: var(--neg); padding-left: 0; }
.lnk { border: 0; background: none; border-radius: 0; padding: 0; color: var(--accent); text-decoration: none; cursor: pointer; text-align: inherit; font-size: inherit; }
.lnk:hover:not(:disabled) { background: none; text-decoration: underline; text-underline-offset: 3px; }
.x { background: none; border-radius: 50%; font-size: 22px; line-height: 1; width: 32px; height: 32px; padding: 0; color: var(--mute); }
.x:hover:not(:disabled) { background: var(--bg-3); color: var(--ink); }

/* ---------- 一级导航：品牌、页签、导入备份 ---------- */
#masthead { position: sticky; top: 0; z-index: 40; height: var(--top); display: flex; align-items: center; gap: 12px 24px;
  padding: 0 max(var(--gap), calc((100% - var(--maxw)) / 2)); padding-top: env(safe-area-inset-top);
  background: rgba(251, 250, 247, .8); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: none; }
.brand .title { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; white-space: nowrap; }
.proj-sel select { border: 0; background: transparent; color: var(--mute); font-size: 12px; padding: 0 2px; max-width: 200px; cursor: pointer; }
#tabs { flex: 1; min-width: 0; }
#tabs ul { display: flex; justify-content: center; gap: 4px 26px; margin: 0; padding: 0; list-style: none; }
#tabs a { display: block; padding: 4px 0; font-size: 13px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
#tabs a:hover { color: var(--ink); }
#tabs a.on { color: var(--ink); font-weight: 600; }
.actions { display: flex; align-items: center; gap: 4px 18px; flex: none; margin-left: auto; }
.actions button:not(.primary) { background: none; padding: 4px 0; border-radius: 0; font-size: 12px; color: var(--ink-2); }
.actions button:not(.primary):hover:not(:disabled) { color: var(--ink); background: none; }
.actions button.motion[aria-pressed="true"] { color: var(--accent); }
.actions button.primary { font-size: 12px; padding: 4px 14px; }
.more { position: relative; display: none; }
.more summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--ink-2); padding: 4px 0; }
.more summary::-webkit-details-marker { display: none; }
.more-list { position: absolute; right: 0; top: 130%; z-index: 45; min-width: 150px; padding: 6px; background: var(--white); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .12), 0 0 0 1px rgba(0, 0, 0, .04); display: grid; }
.more-list button { text-align: left; background: none; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.more-list button:hover:not(:disabled) { background: var(--bg-2); }

/* ---------- 二级导航：页名在左，期间与账户在右 ---------- */
#nav { position: sticky; top: var(--top); z-index: 35; min-height: var(--sub); display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px;
  padding: 8px max(var(--gap), calc((100% - var(--maxw)) / 2));
  background: rgba(251, 250, 247, .8); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px);
  border-top: 1px solid rgba(0, 0, 0, .05); border-bottom: 1px solid rgba(0, 0, 0, .07); }
#nav:empty { display: none; }
.loc { font-family: var(--f-display); font-size: 21px; font-weight: 600; margin-right: auto; white-space: nowrap; letter-spacing: .01em; }
.rangebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 18px; font-size: 13px; }
.seg { display: inline-flex; flex-wrap: nowrap; gap: 2px; padding: 2px; background: var(--bg-3); border-radius: 9px; }
.seg button { background: transparent; border-radius: 7px; padding: 3px 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover:not(:disabled) { background: rgba(255, 255, 255, .55); }
.seg button.on { background: var(--white); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
.seg.sm button { padding: 2px 10px; font-size: 12px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { background: none; width: 28px; height: 28px; padding: 0; font-size: 18px; line-height: 1; color: var(--accent); border-radius: 50%; }
.stepper button:hover:not(:disabled) { background: var(--bg-3); }
.stepper .cur { min-width: 8em; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.25; }
.stepper small { display: block; font-size: 11px; font-weight: 400; color: var(--mute); font-variant-numeric: tabular-nums; }
.custom input { border: 1px solid var(--hair-2); background: var(--white); border-radius: 8px; padding: 2px 8px; }
.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.acct { position: relative; }
.acct summary { cursor: pointer; list-style: none; color: var(--accent); white-space: nowrap; font-size: 13px; }
.acct summary::after { content: " ⌄"; }
.acct summary::-webkit-details-marker { display: none; }
.acct-list { position: absolute; z-index: 45; top: 150%; right: 0; min-width: 240px; padding: 10px 16px; background: var(--white); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .12), 0 0 0 1px rgba(0, 0, 0, .04); }
.acct-list label { display: block; padding: 4px 0; white-space: nowrap; font-size: 14px; }
.acct-list button { margin-top: 6px; }
.covstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--ink-2); }
.covstrip .cl { display: none; }
.mc { white-space: nowrap; }
.mc.ok { display: none; }
.mc.ok-all { color: var(--accent); }
.mc.part { color: var(--amber); }
.mc.miss { color: var(--neg); }
.mc b { font-weight: 400; }
#banner .banner { display: flex; gap: 10px; align-items: flex-start; max-width: var(--maxw); margin: 12px auto 0; padding: 12px 18px; border-radius: 12px; background: #f6e8dc; color: #5a2f1f; font-size: 14px; }
#banner .banner.tip { background: var(--accent-soft); color: #23392d; }
#banner .banner .x { margin-left: auto; flex: none; }

/* ---------- 画：满宽主图 ---------- */
.scene { position: relative; user-select: none; -webkit-user-select: none; }
.scene::after { content: ""; position: absolute; inset: auto 0 -1px; height: 64px; pointer-events: none; z-index: 1; background: linear-gradient(180deg, rgba(251, 250, 247, 0), var(--bg)); }
.scene-vp { position: relative; overflow: hidden; height: 340px; background: #cfdcea; touch-action: pan-y; cursor: grab; transition: height .5s ease; }
.scene-vp:active { cursor: grabbing; }
.scene-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .75s cubic-bezier(.22, .7, .18, 1); will-change: transform; }
.scene-img { display: block; width: 100%; height: 100%; pointer-events: none; }
.scene-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.scene.enter .scene-img { animation: sceneIn 1.1s ease-out both; }
@keyframes sceneIn { from { opacity: 0; filter: saturate(.6) brightness(1.08); } to { opacity: 1; filter: none; } }
.scene-hint { display: none; position: absolute; right: 14px; top: 8px; z-index: 2; margin: 0; font-size: 11px; color: rgba(255, 255, 255, .95); text-shadow: 0 1px 3px rgba(0, 0, 0, .45); pointer-events: none; }
.glow ellipse { opacity: .12; transition: opacity .45s; }
.glow.on ellipse { opacity: .75; }
.birds path { transition: transform .5s ease-out; transform-box: fill-box; transform-origin: center; }
.birds.turn path { transform: translate(18px, -16px) rotate(-14deg) scaleY(.7); }
.birds.turn .bird:nth-child(2) path { transform: translate(26px, -22px) rotate(10deg) scaleY(.6); }
.boat > * { transition: transform 1.3s cubic-bezier(.45, .05, .3, 1); }
.boat.drift > * { transform: translate(130px, -14px); }
.petal { transform-box: fill-box; transform-origin: center; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 150px) rotate(var(--rot)); opacity: 0; } }
.hs { position: absolute; z-index: 4; transform: translate(-50%, -50%) scale(var(--inv, 1)); transform-origin: center; background: none; border: 0; border-radius: 0; padding: 10px; cursor: pointer; }
.hs:hover:not(:disabled) { background: none; }
.hs.off { visibility: hidden; }
.hs .pin { display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); box-shadow: 0 0 0 4px rgba(255, 255, 255, .5); transition: transform .2s; }
.hs .pin::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); animation: ring 2.6s ease-out infinite; }
@keyframes ring { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(2.4); opacity: 0; } }
.hs .tag { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 6px; align-items: baseline; white-space: nowrap; padding: 2px 9px 3px; border-radius: 3px; background: rgba(255, 255, 255, .92); transition: transform .2s, background .2s; }
.hs.below .tag { bottom: auto; top: 30px; }
.hs .tn { font-size: 11px; color: var(--mute); }
.hs .tl { font-size: 13px; font-weight: 600; color: var(--ink); }
.hs:hover .pin, .hs:focus-visible .pin { transform: scale(1.25); background: var(--gold); }
.hs:hover .tag, .hs:focus-visible .tag { transform: translate(-50%, -3px); background: #fff; }
.hs.below:hover .tag, .hs.below:focus-visible .tag { transform: translate(-50%, 3px); }
.hs.cur .pin { background: var(--accent); border-color: #fff; }
.hs.cur .tag { background: var(--ink); }
.hs.cur .tl, .hs.cur .tn { color: #fff; }
.hs:focus-visible { outline: none; }
.hs:focus-visible .tag { outline: 2px solid var(--accent); }

/* ---------- 页面与章节：靠留白分区 ---------- */
#main { outline: none; }
#main.turn > .page { animation: turn .32s ease-out; }
@keyframes turn { from { opacity: 0; transform: translateY(10px); } }
.page { max-width: calc(var(--maxw) + 2 * var(--gap)); margin: 0 auto; padding: 0 var(--gap) 120px; }
.page-h { padding-top: 40px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 24px; }
.page-h h1 { font-size: 40px; line-height: 1.15; margin: 0; letter-spacing: .005em; flex-basis: 100%; }
.page-h .sub { flex: 1 1 320px; font-size: 15px; }
.sect { margin-top: 88px; }
.page-h + .sect, .page-h + .review-metrics + .sect { margin-top: 56px; }
.sect.two { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
.sect-h { display: flex; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; margin-bottom: 18px; }
.sect h2, .editorial-head h2 { font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: .005em; }
.sect h3, .dgrp h3 { font-size: 19px; line-height: 1.3; margin: 28px 0 6px; }
.sect.two h3:first-child, .sect > div > h3:first-child { margin-top: 0; }
.basis { display: inline-flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 13px; margin-left: auto; }
.basis .bl { color: var(--mute); }
.scope-note { flex-basis: 100%; margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: #f6efe0; color: #5c4313; font-size: 14px; }
.page-index { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 28px; margin-top: 14px; font-size: 14px; }
.page-index .lnk::after { content: " ↓"; }
.sect > div + div { margin-top: 48px; }
.sect.two > div + div, .daily-top > div + div, .story-grid > div + div { margin-top: 0; }

/* ---------- 总览首屏：居中的一个数 ---------- */
.paper { padding: 44px 0 0; text-align: center; }
.p-head { display: block; }
.kicker { display: none; }
.p-head h1 { font-size: 19px; line-height: 1.3; margin: 0; color: var(--accent); letter-spacing: .02em; }
.covline { margin: 4px 0 0; font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
.covline.warn { color: var(--amber); }
.figs3 { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
.figs3 > button { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border-radius: 0; padding: 0 32px; min-width: 0; color: inherit; }
.figs3 > button:hover:not(:disabled) { background: none; }
.figs3 > .fig-main { flex-basis: 100%; padding: 0 0 26px; }
.figs3 > .fig2 + .fig2 { border-left: 1px solid var(--hair); }
.fl { display: flex; gap: 8px; align-items: baseline; justify-content: center; flex-wrap: wrap; font-size: 15px; color: var(--mute); }
.fs { display: none; }
.fig-main .fs { display: block; margin-top: 10px; font-size: 15px; color: var(--accent); }
.fig-main:hover .fs { text-decoration: underline; text-underline-offset: 3px; }
.fig2 .fl::after { content: "›"; color: var(--accent); }
.fig2:hover .fl { color: var(--ink); }
.amt { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 500; line-height: 1.25; white-space: nowrap; }
.amt.display { font-family: var(--f-display); font-size: 80px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: lining-nums; color: var(--ink); transition: transform .3s, color .3s; }
.amt.display .cur { font-size: .5em; font-weight: 500; margin-right: 4px; }
.amt.display.neg { color: var(--neg); }
.amt.display.landed { transform: scale(1.03); color: var(--accent); }
.badge { font-size: 14px; color: var(--ink-2); }
.badge.warn { color: var(--amber); }
.badge.warn::before { content: "· "; }
.notes { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 6px 24px; margin-top: 26px; font-size: 14px; }
.notes::before { content: "待核"; color: var(--mute); margin-right: -8px; }
.note-chip { background: none; border-radius: 0; padding: 0; font-size: 14px; color: var(--accent); }
.note-chip:hover:not(:disabled) { background: none; text-decoration: underline; text-underline-offset: 3px; }
.note-chip::after { content: " ›"; }
.note-chip.warn { color: var(--neg); }
.coin { position: fixed; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; z-index: 60; pointer-events: none; display: grid; place-items: center; font: 600 14px var(--f-num); color: #6d4f12; background: radial-gradient(circle at 34% 30%, #fff2c2, #e8c158 38%, #b88a24 70%, #8a6416); box-shadow: inset 0 0 0 2px rgba(255, 240, 190, .6); }

/* 月度现金流：浅底色板块 */
.frame { margin: 96px 0 0; padding: 36px 40px 28px; background: var(--bg-2); border-radius: var(--r); }
.frame-in { background: none; }
.fh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; }
.fh h2 { margin: 0; font-size: 28px; line-height: 1.2; }
.fsub { margin: 0; color: var(--mute); font-size: 14px; flex-basis: 100%; }

/* 本期重点：三个入口 */
.reading-path { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 40px; }
.overview-link { display: grid; justify-items: center; gap: 2px; background: none; border-radius: 0; padding: 4px 16px; text-align: center; min-width: 0; }
.overview-link:hover:not(:disabled) { background: none; }
.overview-link + .overview-link { border-left: 1px solid var(--hair); }
.overview-link-name { font-size: 14px; color: var(--mute); }
.overview-link > .num { font-size: 24px; font-weight: 500; color: var(--ink); }
.overview-link-intent { font-size: 14px; color: var(--accent); }
.overview-link-intent::after { content: " ›"; }
.overview-link:hover .overview-link-intent { text-decoration: underline; text-underline-offset: 3px; }
.overview-arrow { display: none; }

/* ---------- 章节 ---------- */
.editorial-section { margin-top: 112px; }
.editorial-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; margin-bottom: 24px; }
.story-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 56px; }
.story-rank { min-width: 0; }
.story-rank h3 { margin: 0; font-size: 19px; display: inline-block; margin-right: 14px; }
.rank-housing { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); }
.story-links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 16px; }
.donut-wrap { min-width: 0; }
.donut-body { display: grid; grid-template-columns: minmax(130px, .8fr) minmax(200px, 1.2fr); gap: 20px; align-items: center; }
.donut-body svg { display: block; width: 100%; max-width: 240px; margin: 0 auto; }
.donut-segment { cursor: pointer; }
.donut-segment:hover, .donut-segment:focus-visible { stroke-width: 36; outline: none; }
.donut-total { fill: var(--ink); font: 600 32px var(--f-display); }
.donut-caption { fill: var(--mute); font: 13px var(--f-sans); }
.donut-legend { min-width: 0; }
.donut-legend button { width: 100%; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; background: none; border-radius: 0; border-bottom: 1px solid var(--hair); padding: 7px 2px; text-align: left; font-size: 13px; }
.donut-legend button:hover:not(:disabled) { background: var(--bg-2); }
.donut-legend i { width: 8px; height: 8px; border-radius: 50%; }
.donut-name { overflow-wrap: anywhere; }
.donut-percent, .donut-val { text-align: right; }
.donut-percent { color: var(--ink-2); min-width: 44px; }
.donut-val { color: var(--mute); min-width: 66px; }
.donut-credits { display: none; }

/* 可点的指标块：浅底色 */
.review-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.review-metric { display: grid; gap: 2px; align-content: start; min-width: 0; padding: 18px 22px; text-align: left; background: var(--bg-2); border-radius: 14px; color: inherit; font-size: 14px; }
.review-metric > span:first-child { color: var(--mute); }
.review-metric > .num, .review-metric > strong { font-size: 24px; font-weight: 500; color: var(--ink); }
.review-metric small { color: var(--mute); font-size: 13px; }
button.review-metric:hover:not(:disabled) { background: var(--bg-3); }
button.review-metric small::after { content: " ›"; color: var(--accent); }
.review-explain { display: grid; gap: 4px; margin: 20px 0 8px; }
.review-overview h3 { margin-top: 32px; }
.full-ledger-head { margin-top: 0; }
.trip-metrics { margin-top: 32px; }
.drawer-pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin: 10px 0; }
.ledger-card .filters { margin-top: 4px; }

/* ---------- 图表 ---------- */
.chart { margin: 0; }
.chart.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart.scroll .lgd { position: sticky; left: 0; }
.ch { width: 100%; height: auto; display: block; overflow: visible; }
.ch .grid { stroke: #e9e7e1; stroke-width: 1; }
.ch .zero { stroke: #bdb9b0; stroke-width: 1.2; }
.ch .ax { fill: var(--mute); font: 12px var(--f-num); font-variant-numeric: tabular-nums; }
.ch .ax.unit, .ch .ax.yr { font-size: 11px; }
.ch .ax.partl { fill: var(--amber); font-size: 11px; }
.ch .ax.missl { fill: var(--neg); }
.ch .ax.vl { fill: var(--ink-2); font-size: 11.5px; }
.ch .ax.negt, .ch .ax.negl { fill: var(--neg); }
.ch .ax.badge { fill: var(--ink-2); }
.ch .rl { fill: var(--ink); font: 13px var(--f-sans); }
.ch [tabindex] { cursor: pointer; outline: none; }
.ch rect[tabindex]:hover, .ch rect[tabindex]:focus { stroke: var(--ink); stroke-width: 2; }
.ch circle[tabindex]:hover, .ch circle[tabindex]:focus { r: 7; }
.ch .cat.miss { cursor: pointer; }
.ch .cat.miss:focus rect { stroke: var(--neg); stroke-width: 2; }
.ch .conn { stroke: var(--hair-2); stroke-dasharray: 3 3; }
.bar.in, .lgd .sw.in { fill: var(--gold); background: var(--gold); }
.bar.out, .lgd .sw.out { fill: var(--river); background: var(--river); }
.bar.pers, .lgd .sw.pers { fill: var(--cypress); background: var(--cypress); }
.bar.paid, .lgd .sw.paid { fill: #9a9081; background: #9a9081; }
.bar.reimb, .lgd .sw.reimb { fill: #8fb0c7; background: #8fb0c7; }
.bar.pend, .lgd .sw.pend { fill: #e0bd73; background: #e0bd73; }
.bar.self, .lgd .sw.self, .bar.g1, .lgd .sw.g1 { fill: var(--terra); background: var(--terra); }
.bar.g2, .lgd .sw.g2 { fill: var(--cypress); background: var(--cypress); }
.bar.g3, .lgd .sw.g3 { fill: var(--river); background: var(--river); }
.bar.g4, .lgd .sw.g4 { fill: #a99263; background: #a99263; }
.bar.wf-add, .lgd .sw.wf-add { fill: var(--gold); background: var(--gold); }
.bar.wf-sub, .lgd .sw.wf-sub { fill: var(--river); background: var(--river); }
.bar.wf-total, .bar.wf-start, .lgd .sw.wf-total { fill: var(--accent); background: var(--accent); }
.ln.bal { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.dot { fill: var(--white); stroke: var(--accent); stroke-width: 2; }
.dot.negd { fill: var(--neg); }
.lgd { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.lgd .li { display: inline-flex; align-items: center; gap: 6px; }
.lgd .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--ink-2); }
.lgd .sw.line { height: 3px; background: var(--accent); }
.lgd .sw.miss { background: repeating-linear-gradient(45deg, #c3bba9 0 2px, #ece6d8 2px 5px); }
.lgd .sw.part { background: none; border: 1px dashed var(--amber); }
.lgd .sw.neg { background: repeating-linear-gradient(-45deg, var(--neg) 0 2px, var(--neg-bg) 2px 5px); }
.ctip { position: fixed; z-index: 80; display: none; pointer-events: none; max-width: 320px; padding: 7px 11px; border-radius: 10px; background: rgba(29, 29, 31, .94); color: #f5f5f7; font: 12.5px/1.5 var(--f-num); font-variant-numeric: tabular-nums; }
.ctip b { font-weight: 600; display: block; }

/* ---------- 表格：细线，无底色 ---------- */
.tblw { display: flex; flex-direction: column; min-width: 0; }
.tblw .copy { align-self: flex-end; background: none; padding: 0; margin: 4px 0 6px; font-size: 12px; color: var(--accent); border-radius: 0; }
.tblw .copy:hover:not(:disabled) { background: none; text-decoration: underline; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 400; color: var(--mute); font-size: 12px; border-bottom: 1px solid var(--hair-2); padding: 8px 10px; white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--hair); vertical-align: top; overflow-wrap: anywhere; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td:first-child, .tbl .st-confirmed, .tbl .st-provisional, .tbl .st-unresolved, .tbl .st-excluded { white-space: nowrap; }
.tbl td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl tfoot td { border-top: 1px solid var(--ink); border-bottom: 0; font-weight: 600; }
.tbl tbody tr[tabindex] { cursor: pointer; }
.tbl tbody tr[tabindex]:hover td, .tbl tbody tr[tabindex]:focus td { background: var(--bg-2); outline: none; }
.tbl tr.struck td { color: var(--mute); text-decoration: line-through; text-decoration-color: rgba(110, 110, 115, .6); }
.tbl tr.nofx td { background: rgba(176, 61, 39, .04); }
.tbl .st-provisional { color: var(--amber); }
.tbl .st-unresolved { color: var(--neg); }
.tbl-meta { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin: 12px 0; color: var(--ink-2); font-size: 13px; }
.pager { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 16px 0 8px; font-size: 14px; }
.filters input[type=search], .filters select, select, .row input[type=date] { border: 1px solid var(--hair-2); background: var(--white); border-radius: 8px; padding: 4px 10px; max-width: 100%; }
.filters input[type=search] { min-width: 220px; }
.chip { display: inline; font-size: 13px; white-space: nowrap; color: var(--ink-2); }
.chip.k-公司 { color: var(--river); } .chip.k-混合 { color: var(--terra); } .chip.k-待归属 { color: var(--neg); }
.chip.lv-confirmed { color: var(--accent); } .chip.lv-review { color: var(--amber); } .chip.lv-expected, .chip.lv-awaiting { color: var(--river); }
.tag { display: inline; margin-left: 8px; font-size: 13px; color: var(--amber); }
.tag.ok { color: var(--accent); }
details > summary { cursor: pointer; color: var(--accent); padding: 6px 0; }
details.recon { margin-top: 18px; }
details.recon > summary { font-size: 14px; }
.daily-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.daily-top h2 { margin-bottom: 14px; }

/* 出差 */
.strip { display: flex; flex-wrap: wrap; gap: 8px 40px; margin: 20px 0 8px; }
.strip .st { display: flex; flex-direction: column; }
.strip .lbl { font-size: 13px; color: var(--mute); }
.trip { padding-top: 8px; }
.figs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 14px 0 16px; }
.fig { display: flex; flex-direction: column; min-width: 0; padding: 14px 16px; background: var(--bg-2); border-radius: 12px; }
.fig .lbl { font-size: 13px; color: var(--mute); }
.fig .val { font-size: 19px; line-height: 1.35; white-space: normal; font-variant-numeric: tabular-nums; }
.fig .fsub { font-size: 12px; color: var(--mute); flex-basis: auto; }
.fig.self .val { color: var(--terra); font-weight: 600; }
.fig.self.review .val { color: var(--amber); font-weight: 400; }
.calc { margin: 8px 0; font-size: 14.5px; }
.calc .strong { font-weight: 600; font-size: 16px; }
.gaps { padding-left: 18px; margin: 6px 0; }
.gaps li { margin: 4px 0; }
.gaps li.p-high { color: var(--neg); }

/* 核对与项目 */
details.rc { border-bottom: 1px solid var(--hair); }
details.rc > summary { display: flex; justify-content: space-between; padding: 12px 0; color: var(--ink); }
details.rc.warn > summary { color: var(--neg); }
details.rc .cnt { color: var(--mute); font-variant-numeric: tabular-nums; }
.rc-b { padding: 0 0 16px; overflow-x: auto; }
.proj { display: grid; gap: 24px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.danger { margin-top: 10px; }
.nw summary { font-size: 19px; font-weight: 600; color: var(--ink); }
.interlude { display: none; }

/* ---------- 抽屉与对话框 ---------- */
.drawer-wrap, .modal-wrap { position: fixed; inset: 0; z-index: 50; display: flex; background: rgba(0, 0, 0, .28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.drawer-wrap { justify-content: flex-end; }
.modal-wrap { align-items: center; justify-content: center; padding: 20px; z-index: 55; }
.drawer-panel { width: min(1100px, 94vw); height: 100%; background: var(--white); display: flex; flex-direction: column; outline: none; animation: slide .22s ease-out; }
.modal-panel { width: min(900px, 96vw); max-height: 92vh; background: var(--white); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; outline: none; animation: pop .18s ease-out; }
.drawer-head, .modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 28px; padding-top: max(14px, env(safe-area-inset-top)); border-bottom: 1px solid var(--hair); }
.drawer-head h2, .modal-head h2 { font-size: 21px; margin: 0; flex: 1; min-width: 0; }
.back { padding: 4px 14px; }
.drawer-body, .modal-body { padding: 14px 28px 32px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 28px; border-top: 1px solid var(--hair); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.dsum { display: flex; gap: 40px; flex-wrap: wrap; padding: 10px 0 16px; border-bottom: 1px solid var(--hair); }
.dsum > div { display: flex; flex-direction: column; }
.dsum .num { font-size: 22px; font-weight: 500; }
.dsum .strong .num { font-size: 28px; font-weight: 600; }
.dgrp h3 { display: flex; gap: 10px; align-items: baseline; margin-top: 26px; }
.dgrp .cnt { font-size: 12px; font-weight: 400; color: var(--mute); }
.kv { display: grid; grid-template-columns: 8em 1fr; gap: 4px 12px; margin: 6px 0 12px; }
.kv dt { color: var(--mute); } .kv dd { margin: 0; }
.detail dl { display: grid; grid-template-columns: 15em 1fr; gap: 4px 14px; font-size: 14px; }
.detail dt { color: var(--mute); } .detail dd { margin: 0; word-break: break-word; }
.issues td { font-size: 13px; }
.notices { color: var(--ink-2); font-size: 13px; padding-left: 18px; }
.toast { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 90; max-width: 90vw; padding: 10px 20px; border-radius: 980px; background: rgba(29, 29, 31, .94); color: #fff; font-size: 14px; transition: opacity .5s; }
.toast.ok { background: var(--accent); }
.toast.out { opacity: 0; }

/* 空状态 */
.page.empty-state { max-width: none; padding: 0 0 120px; }
.hero-empty { position: relative; margin: 0; min-height: 440px; display: flex; align-items: flex-end; justify-content: center; padding: 30px 40px; overflow: hidden; text-align: center; }
.he-art { position: absolute; inset: 0; background: var(--scene-art) center 55% / cover; }
.hero-empty::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(251, 250, 247, 0) 30%, rgba(251, 250, 247, .85) 72%, var(--bg) 96%); }
.hero-empty .hero-text { position: relative; z-index: 1; }
.hero-empty .kicker { display: block; font-size: 14px; color: var(--ink-2); margin: 0 0 4px; }
.hero-empty h1 { font-size: 56px; line-height: 1.1; margin: 0; }
.hero-empty .cov { margin: 8px 0 0; font-size: 19px; color: var(--ink-2); }
.empty-state .sect { margin-top: 32px; padding: 0 var(--gap); text-align: center; }
.empty-state .sect p { max-width: 40em; margin: 6px auto; color: var(--ink-2); }
.empty-state .sect p.dim { color: var(--mute); font-size: 14px; }
.empty-state .row { justify-content: center; margin-top: 24px; }
.empty-state .row button { font-size: 15px; padding: 8px 20px; }

/* ---------- 宽度 ---------- */
@media (max-width: 1080px) {
  #masthead { position: static; height: auto; flex-wrap: wrap; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: 0; row-gap: 4px; }
  .brand { min-height: 36px; align-items: center; }
  .actions { margin-left: auto; }
  #tabs { flex-basis: 100%; order: 3; }
  #tabs ul { justify-content: flex-start; overflow-x: auto; scrollbar-width: none; gap: 24px; padding: 6px 0 10px; }
  #tabs ul::-webkit-scrollbar { display: none; }
  #tabs a { font-size: 14px; }
  #tabs a.on { box-shadow: inset 0 -2px 0 var(--ink); }
  #nav { top: 0; }
  html { scroll-padding-top: calc(var(--sub) + 16px); }
}
@media (max-width: 860px) {
  :root { --gap: 18px; }
  .page-h { padding-top: 32px; }
  .page-h h1 { font-size: 32px; }
  .sect { margin-top: 64px; }
  .editorial-section { margin-top: 80px; }
  .sect.two, .daily-top, .story-grid { grid-template-columns: minmax(0, 1fr); gap: 40px; }
  .frame { margin-top: 64px; padding: 24px 18px 18px; margin-left: calc(-1 * var(--gap) + 6px); margin-right: calc(-1 * var(--gap) + 6px); }
  .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tbl { display: block; overflow-x: auto; }
  .detail dl, .kv { grid-template-columns: 1fr; }
  .drawer-panel { width: 100vw; }
  .drawer-head, .modal-head, .drawer-body, .modal-body, .modal-foot { padding-left: 18px; padding-right: 18px; }
  .basis { margin-left: 0; }
}
@media (max-width: 700px) {
  .loc { display: none; }
  #nav { padding-top: 8px; padding-bottom: 8px; }
  .rangebar { justify-content: flex-start; width: 100%; gap: 8px 14px; }
  .actions > .opt { display: none; }
  .more { display: block; }
  .brand .title { display: none; }
  .proj-sel select { max-width: 150px; font-size: 13px; color: var(--ink-2); }
  .hs .tn { display: none; }
  .scene-hint { display: block; }
  .amt.display { font-size: 52px; }
  .figs3 > button { padding: 0 18px; }
  .amt { font-size: 20px; }
  .reading-path { grid-template-columns: minmax(0, 1fr); margin-top: 28px; }
  .overview-link { grid-template-columns: 1fr auto; justify-items: start; text-align: left; padding: 12px 0; }
  .overview-link > .num { grid-row: span 2; align-self: center; font-size: 19px; }
  .overview-link + .overview-link { border-left: 0; border-top: 1px solid var(--hair); }
  .review-metrics { grid-template-columns: minmax(0, 1fr); }
  .donut-body { grid-template-columns: minmax(105px, .7fr) minmax(180px, 1.3fr); gap: 8px; }
  .donut-legend button { font-size: 12px; gap: 4px; }
  .acct-list { max-width: min(80vw, 300px); }
  .acct-list label { white-space: normal; }
  .hero-empty h1 { font-size: 40px; }
}
@media (max-width: 340px) {
  .donut-body { grid-template-columns: 1fr; }
  .donut-body svg { max-width: 180px; }
}
.paper > *, .story-grid > *, .sect.two > *, .daily-top > * { min-width: 0; }
.chart, .chart.scroll { max-width: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  #masthead, #nav, .drawer-wrap, .modal-wrap { -webkit-backdrop-filter: none; backdrop-filter: none; }
}
html.reduce *, html.reduce *::before, html.reduce *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media print { #nav, #masthead .actions, #tabs, .scene { display: none; } #masthead { position: static; } }
</style>

      const cny = pay.cny == null ? null : U.mulDiv(a.allocated_amount, pay.cny, pay.amt);
      push({ tx: pay, alloc: a, line, date: pay.post, acct: pay.acct, ccy: pay.ccy, k: 'alloc', b: a.status === 'matched' ? (line ? line.category : 'orphan') : 'candidate', cny, amt: a.allocated_amount, status: a.status, trip: line ? line.trip_id : null, city: line ? line.city : null });
    }
    M._cache[key] = out;
    return out;
  }

  /* ---------- 汇总 ---------- */
  function newAgg() { return { cny: 0, n: 0, ids: [], nofx: {}, byStatus: {} }; }
  function addAgg(a, e, sign) {
    sign = sign || 1;
    a.n++; if (a.ids.indexOf(e.tx.id) < 0) a.ids.push(e.tx.id);
    if (e.cny == null) { const k = e.ccy; a.nofx[k] = a.nofx[k] || { amt: 0, n: 0, ids: [] }; a.nofx[k].amt += sign * e.amt; a.nofx[k].n++; a.nofx[k].ids.push(e.tx.id); return; }
    a.cny += sign * e.cny;
    const s = e.status || 'confirmed'; a.byStatus[s] = (a.byStatus[s] || 0) + sign * e.cny;
  }
  function inRange(e, o) {
    if (e.date < o.from || e.date > o.to) return false;
    if (o.accounts && o.accounts.size && !o.accounts.has(e.acct)) return false;
    return true;
  }

  function summary(M, o) {
    const evs = events(M, o).filter(e => inRange(e, o));
    const inc = { recurring: newAgg(), bonus: newAgg(), dividend: newAgg(), other: newAgg(), allowance: newAgg() };
    const sp = { personal: newAgg(), household: newAgg(), unassigned_out: newAgg(), unassigned_in: newAgg(), third_out: newAgg(), third_in: newAgg(), business: newAgg(), neutral: newAgg() };
    const co = { arrived: newAgg(), matched: newAgg(), candidate: newAgg(), byCat: {} };
    const nonecon = newAgg(); const nofx = {}; const refunds = { linked: newAgg(), unlinked: newAgg(), cross: newAgg(), candidate: newAgg() };
    for (const e of evs) {
      if (e.cny == null && e.k !== 'alloc') { nofx[e.ccy] = nofx[e.ccy] || { amt: 0, n: 0, ids: [] }; nofx[e.ccy].amt += e.amt; nofx[e.ccy].n++; nofx[e.ccy].ids.push(e.tx.id); }
      switch (e.k) {
        case 'income': addAgg(inc[e.b], e); break;
        case 'spend': {
          if (e.b === 'unassigned') { if (e.amt > 0) addAgg(sp.unassigned_out, e); else addAgg(sp.unassigned_in, e, -1); }
          else if (e.b === 'third_party') { if (e.amt > 0) addAgg(sp.third_out, e); else addAgg(sp.third_in, e, -1); }
          else addAgg(sp[e.b], e);
          if (e.refund && (e.b === 'personal' || e.b === 'household')) {
            const tx = e.tx, r = tx.refund || {};
            if (r.target) { addAgg(refunds.linked, e); if (U.monthOf(r.target.date) !== U.monthOf(tx.post)) addAgg(refunds.cross, e); }
            else addAgg(refunds.unlinked, e);
            if (r.candidates && r.candidates.length) addAgg(refunds.candidate, e);
          }
          break;
        }
        case 'third_party': addAgg(e.b === 'out' ? sp.third_out : sp.third_in, e, e.b === 'out' ? -1 : 1); break;
        case 'business': addAgg(sp.business, e); break;
        case 'company_in': addAgg(co.arrived, e); break;
        case 'alloc':
          if (e.b === 'candidate') addAgg(co.candidate, e);
          else { addAgg(co.matched, e); co.byCat[e.b] = co.byCat[e.b] || newAgg(); addAgg(co.byCat[e.b], e); if (e.b === 'allowance') addAgg(inc.allowance, e); }
          break;
        case 'nonecon': addAgg(nonecon, e); break;
      }
    }
    // 未匹配到账 = 实收 − 已匹配（逐笔）
    const unmatched = newAgg();
    const payIds = new Set(co.arrived.ids);
    for (const pid of payIds) {
      const pay = M.byId[pid]; const m = matchedFor(M, pid);
      const rest = pay.amt - m.amt;
      if (rest > 0) {
        const cny = pay.cny == null ? null : U.mulDiv(rest, pay.cny, pay.amt);
        addAgg(unmatched, { tx: pay, cny, amt: rest, ccy: pay.ccy, status: 'confirmed' });
      }
    }
    co.unmatched = unmatched;
    const incTotal = inc.recurring.cny + inc.bonus.cny + inc.dividend.cny + inc.other.cny + inc.allowance.cny;
    const spendTotal = sp.personal.cny + (o.includeHousehold ? sp.household.cny : 0);
    const pendingTotal = (sp.personal.byStatus.provisional || 0) + (sp.personal.byStatus.unresolved || 0) + sp.unassigned_out.cny;
    return { o, inc, sp, co, nonecon, nofx, refunds, incTotal, spendTotal, net: incTotal - spendTotal, pendingTotal, evCount: evs.length };
  }
  function matchedFor(M, payId) {
    let amt = 0; const ids = [];
    for (const a of M.allocs) if (a.payment_tx_id === payId && a.status === 'matched' && M.byId[payId] && a.currency === M.byId[payId].ccy) { amt += a.allocated_amount; ids.push(a.id); }
    return { amt, ids };
  }

  /* 按月序列（与 summary 同一事件来源） */
  function monthly(M, o) {
    const months = U.monthsBetween(U.monthOf(o.from), U.monthOf(o.to));
    return months.map(mo => {
      const from = U.maxDate(o.from, U.monthStart(mo)), to = U.minDate(o.to, U.monthEnd(mo));
      const s = summary(M, Object.assign({}, o, { from, to }));
      return { month: mo, from, to, s, cov: coverage(M, from, to) };
    });
  }

  /* 分组下钻：类别组 / 账户 / 品牌 / 城市 */
  function breakdown(M, o, dim) {
    const evs = events(M, o).filter(e => inRange(e, o) && e.k === 'spend' && (e.b === 'personal' || (o.includeHousehold && e.b === 'household')));
    const m = new Map();
    for (const e of evs) {
      let k;
      if (dim === 'group') k = catGroup(e.cat);
      else if (dim === 'category') k = e.cat || '未分类';
      else if (dim === 'account') k = e.acct;
      else if (dim === 'brand') k = e.brand || '（无品牌）';
      else if (dim === 'city') k = e.city || '（未标城市）';
      if (!m.has(k)) m.set(k, newAgg());
      addAgg(m.get(k), e);
    }
    return Array.from(m.entries()).map(([k, a]) => ({ key: k, agg: a })).sort((a, b) => b.agg.cny - a.agg.cny);
  }

  /* 覆盖：按 Periods 计算范围内实际覆盖 */
  function coverage(M, from, to) {
    const ps = M.periods.filter(p => p.to_date >= from && p.from_date <= to);
    if (!ps.length) return { from: null, to: null, partial: true, none: true, months: [], scopes: [] };
    let cf = null, ct = null, partial = false; const months = [];
    for (const p of ps) {
      const f = U.maxDate(p.from_date, from), t = U.minDate(p.to_date, to);
      cf = U.minDate(cf, f); ct = U.maxDate(ct, t);
      const isPartial = p.status !== 'complete';
      if (isPartial) partial = true;
      months.push({ month: p.month, from: p.from_date, to: p.to_date, status: p.status, scope: p.scope });
    }
    const allMonths = U.monthsBetween(U.monthOf(from), U.monthOf(to));
    const missing = allMonths.filter(mo => !ps.some(p => p.month === mo));
    if (missing.length) partial = true;
    if (cf > from || ct < to) partial = true;
    return { from: cf, to: ct, partial, months, missing, scopes: Array.from(new Set(ps.map(p => p.scope))) };
  }

  /* ---------- 出差 ---------- */
  const STATUS_RANK = { draft: 0, submitted: 1, approved: 2, paid: 3 };
  function sumByCcy(list, f) { const m = {}; for (const x of list) { const r = f(x); if (!r) continue; m[r[0]] = (m[r[0]] || 0) + r[1]; } return m; }
  function singleCcy(m) { const ks = Object.keys(m).filter(k => m[k] !== 0); return ks.length === 1 ? ks[0] : (ks.length === 0 ? null : false); }

  function trips(M, o) {
    o = o || {};
    const ids = new Set(Object.keys(M.tripInfo));
    for (const tx of M.eff) if (tx.trip) ids.add(tx.trip);
    const out = [];
    for (const id of ids) {
      const info = M.tripInfo[id] || { id, name: null, cities: new Set(), start: null, end: null };
      const lines = Object.values(M.lines).filter(l => l.trip_id === id);
      const txs = M.eff.filter(t => t.trip === id || (t.refund && t.refund.target && t.refund.target.trip === id));
      let start = info.start, end = info.end;
      for (const t of txs) { start = U.minDate(start, t.date); end = U.maxDate(end, t.date); }
      if (o.from && (end < o.from || start > o.to)) continue;
      const lodgingTx = txs.filter(t => LODGING_RE.test(t.cat) && (t.amt < 0 || REFUND_EVS.has(t.ev) || t.ev === 'business_refund'));
      const paidByCcy = sumByCcy(lodgingTx, t => [t.ccy, -t.amt]);
      const paidCny = lodgingTx.every(t => t.cny != null) ? -U.sum(lodgingTx, t => t.cny) : null;
      const lodLines = lines.filter(l => l.category === 'lodging');
      const claimByCcy = sumByCcy(lodLines, l => [l.currency, l.amount]);
      const claimCny = lodLines.length && lodLines.every(l => l.amount_cny != null) ? U.sum(lodLines, l => l.amount_cny) : null;
      // 住宿状态：取最弱
      let lodStatus = null;
      for (const l of lodLines) lodStatus = lodStatus == null || STATUS_RANK[l.status] < STATUS_RANK[lodStatus] ? l.status : lodStatus;
      const lodging = { txIds: lodgingTx.map(t => t.id), lineIds: lodLines.map(l => l.id), paidByCcy, paidCny, claimByCcy, claimCny, status: lodStatus, level: null, self: null, selfCcy: null, excess: null, basis: null, note: null };
      if (!lodLines.length) { lodging.level = 'review'; lodging.note = '缺住宿费用行'; }
      else if (lodStatus === 'draft') { lodging.level = 'review'; lodging.note = '报销草稿，未定'; }
      else if (!lodgingTx.length) { lodging.level = 'review'; lodging.note = '未找到住宿付款'; }
      else {
        lodging.level = lodStatus === 'paid' ? 'confirmed' : lodStatus === 'approved' ? 'awaiting' : 'expected';
        const pc = singleCcy(paidByCcy), cc = singleCcy(claimByCcy);
        let diff = null;
        if (pc && cc && pc === cc) { diff = paidByCcy[pc] - claimByCcy[cc]; lodging.selfCcy = pc; lodging.basis = 'same'; }
        else if (paidCny != null && claimCny != null) { diff = paidCny - claimCny; lodging.selfCcy = M.base; lodging.basis = 'cny'; lodging.note = '跨币种：按已提供的人民币等值比较'; }
        else { lodging.level = 'review'; lodging.note = '跨币种且缺人民币等值，无法比较'; }
        if (diff != null) {
          if (diff < 0) { lodging.self = 0; lodging.excess = -diff; lodging.flag = '公司报销住宿高于已匹配净付，请核对'; }
          else lodging.self = diff;
        }
      }
      // 自贴的人民币金额只在这里算一次：已是人民币口径直接用；同币种按住宿付款的实际折算比例换算
      lodging.selfCny = null;
      if (lodging.self != null) {
        if (lodging.selfCcy === M.base) lodging.selfCny = lodging.self;
        else if (paidCny != null && paidByCcy[lodging.selfCcy]) lodging.selfCny = U.mulDiv(lodging.self, paidCny, paidByCcy[lodging.selfCcy]);
      }
      // 日补助
      const allowLines = lines.filter(l => l.category === 'allowance');
      const allowByCcy = sumByCcy(allowLines, l => [l.currency, l.amount]);
      let allowStatus = null; for (const l of allowLines) allowStatus = allowStatus == null || STATUS_RANK[l.status] < STATUS_RANK[allowStatus] ? l.status : allowStatus;
      // 到账（只认匹配到本行程费用行的拆分）
      const lineIds = new Set(lines.map(l => l.id));
      const tripAllocs = M.allocs.filter(a => lineIds.has(a.line_id));
      const matched = tripAllocs.filter(a => a.status === 'matched' && M.byId[a.payment_tx_id] && !M.byId[a.payment_tx_id].void && a.currency === M.byId[a.payment_tx_id].ccy);
      const candidate = tripAllocs.filter(a => a.status === 'candidate');
      const arrivedByCcy = sumByCcy(matched, a => [a.currency, a.allocated_amount]);
      const arrivedCny = matched.every(a => M.byId[a.payment_tx_id].cny != null) ? U.sum(matched, a => U.mulDiv(a.allocated_amount, M.byId[a.payment_tx_id].cny, M.byId[a.payment_tx_id].amt)) : null;
      // 实际支付（本行程的垫付与其他差旅支付，含商户退款）
      const pays = txs.filter(t => t.ev !== 'reimbursement_received' && t.ev !== 'income' && (t.amt < 0 || REFUND_EVS.has(t.ev) || t.ev === 'business_refund'));
      const paidAllByCcy = sumByCcy(pays, t => [t.ccy, -t.amt]);
      const paidAllCny = pays.every(t => t.cny != null) ? -U.sum(pays, t => t.cny) : null;
      const cash = { arrivedByCcy, paidAllByCcy, net: null, ccy: null, basis: null };
      const ac = singleCcy(arrivedByCcy), pc2 = singleCcy(paidAllByCcy);
      if ((ac === null || ac) && (pc2 === null || pc2) && (!ac || !pc2 || ac === pc2)) { cash.ccy = ac || pc2; cash.arrived = arrivedByCcy[cash.ccy] || 0; cash.paid = paidAllByCcy[cash.ccy] || 0; cash.net = cash.arrived - cash.paid; cash.basis = 'same'; }
      else if (arrivedCny != null && paidAllCny != null) { cash.ccy = M.base; cash.arrived = arrivedCny || 0; cash.paid = paidAllCny; cash.net = cash.arrived - cash.paid; cash.basis = 'cny'; }
      // 覆盖：所有费用行已付且已足额匹配，且无候选
      const fullyMatched = lines.length > 0 && lines.every(l => l.status === 'paid' && U.sum(matched.filter(a => a.line_id === l.id), a => a.allocated_amount) >= l.amount && matched.some(a => a.line_id === l.id && a.currency === l.currency));
      cash.partial = !fullyMatched || candidate.length > 0 || !lines.length;
      // 住宿自贴 − 日补助
      let lodMinusAllow = null;
      const alc = singleCcy(allowByCcy);
      if (lodging.self != null && lodging.level !== 'review') {
        if (alc && alc === lodging.selfCcy) lodMinusAllow = { amt: lodging.self - allowByCcy[alc], ccy: alc };
        else if (!allowLines.length) lodMinusAllow = { amt: lodging.self, ccy: lodging.selfCcy, noAllowance: true };
      }
      // 待报销 / 未配对
      const outstanding = lines.filter(l => l.status !== 'paid');
      const unpaired = lines.filter(l => l.status === 'paid' && U.sum(matched.filter(a => a.line_id === l.id), a => a.allocated_amount) < l.amount);
      const personalTx = txs.filter(t => t.owner === 'personal' && t.ev !== 'reimbursement_received');
      const claims = Array.from(new Set(lines.map(l => l.claim_id).concat(txs.map(t => t.claim).filter(Boolean))));
      out.push({
        id, name: info.name || id, cities: Array.from(info.cities), start, end, claims, lines, txIds: txs.map(t => t.id),
        lodging, allowance: { byCcy: allowByCcy, status: allowStatus, lineIds: allowLines.map(l => l.id) },
        arrivals: { byCcy: arrivedByCcy, cny: arrivedCny, allocIds: matched.map(a => a.id), payIds: Array.from(new Set(matched.map(a => a.payment_tx_id))), candidates: candidate },
        cash, lodMinusAllow, outstanding, unpaired, personalTx: personalTx.map(t => t.id), provisionalTx: txs.filter(t => t.status !== 'confirmed').map(t => t.id)
      });
    }
    return out.sort((a, b) => (b.start || '') < (a.start || '') ? -1 : 1);
  }

  /* 报销单状态汇总（未到账部分独立显示） */
  function claimStatus(M, o) {
    const res = { draft: {}, submitted: {}, approved: {}, paid: {}, ids: { draft: [], submitted: [], approved: [], paid: [] } };
    for (const l of Object.values(M.lines)) {
      const d = l.start_date || l.submitted_date || l.received_date;
      if (o && o.from && d && (d < o.from || d > o.to)) continue;
      const s = l.status; if (!res[s]) continue;
      res[s][l.currency] = (res[s][l.currency] || 0) + l.amount; res.ids[s].push(l.id);
    }
    return res;
  }

  /* 公司到账逐笔对账 */
  function arrivals(M, o) {
    return M.eff.filter(t => t.ev === 'reimbursement_received' && (!o || (t.post >= o.from && t.post <= o.to))).map(t => {
      const allocs = M.allocs.filter(a => a.payment_tx_id === t.id);
      const sameCcy = allocs.filter(a => a.currency === t.ccy);
      const matched = U.sum(sameCcy.filter(a => a.status === 'matched'), a => a.allocated_amount);
      const cand = U.sum(sameCcy.filter(a => a.status === 'candidate'), a => a.allocated_amount);
      return { tx: t, allocs, matched, candidate: cand, unmatched: t.amt - matched, over: matched > t.amt, ccyMismatch: allocs.filter(a => a.currency !== t.ccy) };
    });
  }

  /* ---------- 酒店 ---------- */
  function hotels(M, o, tripList) {
    const tripSelf = {}; for (const tr of tripList || trips(M)) tripSelf[tr.id] = tr.lodging;
    const rows = [];
    for (const t of M.eff) {
      const cat = t.icat || t.cat;
      if (!LODGING_RE.test(cat)) continue;
      const isRefund = REFUND_EVS.has(t.ev) || t.ev === 'business_refund';
      const anchor = isRefund && t.refund && t.refund.target && (o.refundBasis || 'original') === 'original' ? t.refund.target.date : (t.amt > 0 ? t.post : t.date);
      if (anchor < o.from || anchor > o.to) continue;
      if (o.accounts && o.accounts.size && !o.accounts.has(t.acct)) continue;
      const owner = isRefund ? t.effOwner : t.owner;
      let kind = owner === 'personal' ? '个人' : owner === 'business' ? '公司' : owner === 'household' ? '亲属' : owner === 'unknown' ? '待归属' : '其他';
      const trip = t.trip || (t.itrip) || null;
      if (owner === 'business' && trip && tripSelf[trip] && (tripSelf[trip].self > 0 || tripSelf[trip].level === 'review')) kind = '混合';
      const s = (t.sub || '') + (t.d.description || '') + (t.merchant || '');
      const part = t.ev === 'deposit' || t.ev === 'deposit_return' || /押金/.test(s) ? '押金' : /小费/.test(s) ? '小费' : /餐|饮/.test(t.sub || '') ? '餐饮' : '房费';
      rows.push({ t, date: anchor, kind, part, trip, cost: t.cny == null ? null : -t.cny, costAmt: -t.amt, nonecon: NON_ECON.has(t.ev) });
    }
    return rows.sort((a, b) => a.date < b.date ? -1 : 1);
  }

  /* ---------- 奢侈品 ---------- */
  function luxury(M, o) {
    const brands = new Map();
    const get = (b) => { if (!brands.has(b)) brands.set(b, { brand: b, paid: 0, refund: 0, net: 0, nofx: [], subs: new Set(), payIds: [], refundIds: [], proxy: [], proxyAmt: 0, proxyRecovered: 0 }); return brands.get(b); };
    const original = (o.refundBasis || 'original') === 'original';
    for (const t of M.eff) {
      const cat = t.icat || t.cat;
      if (!/奢侈/.test(cat)) continue;
      if (o.accounts && o.accounts.size && !o.accounts.has(t.acct)) continue;
      const isRefund = REFUND_EVS.has(t.ev);
      const date = isRefund ? (original && t.refund && t.refund.target ? t.refund.target.date : t.post) : t.flowDate;
      if (date < o.from || date > o.to) continue;
      const b = get(t.ibrand || t.brand || '（无品牌）');
      if (t.sub || t.isub) b.subs.add(t.isub || t.sub);
      const owner = isRefund ? t.effOwner : t.owner;
      if (t.ev === 'third_party' || owner === 'third_party') {
        if (t.amt < 0) { b.proxy.push(t.id); b.proxyAmt += t.cny == null ? 0 : -t.cny; const rp = M.repaid.get(t.id); if (rp && rp.confidence === 'confirmed') { const back = M.byId[rp.to_id === t.id ? rp.from_id : rp.to_id]; if (back && !back.void) b.proxyRecovered += back.cny || 0; } }
        continue;
      }
      if (owner !== 'personal') continue;
      if (t.cny == null) { b.nofx.push(t.id); continue; }
      if (isRefund) { b.refund += t.cny; b.refundIds.push(t.id); } else if (t.ev === 'expense' || t.ev === 'fee') { b.paid += -t.cny; b.payIds.push(t.id); }
      b.net = b.paid - b.refund;
    }
    return Array.from(brands.values()).map(b => Object.assign(b, { subs: Array.from(b.subs) })).sort((a, b) => b.net - a.net || b.proxyAmt - a.proxyAmt);
  }

  /* ---------- 净资产（快照） ---------- */
  function netWorth(M, asOf) {
    const dates = Array.from(new Set(M.balances.map(b => b.as_of))).sort();
    const d = asOf && dates.indexOf(asOf) >= 0 ? asOf : dates[dates.length - 1];
    const rows = M.balances.filter(b => b.as_of === d);
    const byCcy = {}; const missing = [];
    for (const b of rows) { if (b.amount == null) { missing.push(b); continue; } byCcy[b.currency] = (byCcy[b.currency] || 0) + b.amount; }
    return { dates, asOf: d, rows, byCcy, missing, base: M.base };
  }

  /* ---------- 核对清单 ---------- */
  function recon(M, o) {
    const inR = (d) => !o || (d >= o.from && d <= o.to);
    const r = {};
    r.nofx = M.eff.filter(t => t.cny == null && inR(t.flowDate) && t.ev !== 'transfer');
    r.unlinkedRefunds = M.eff.filter(t => REFUND_EVS.has(t.ev) && t.refund && !t.refund.target && inR(t.post));
    r.candidateRefunds = M.eff.filter(t => t.refund && t.refund.candidates.length && inR(t.post));
    r.crossRefunds = M.eff.filter(t => t.refund && t.refund.target && U.monthOf(t.refund.target.date) !== U.monthOf(t.post) && (inR(t.post) || inR(t.refund.target.date)));

    const months = U.monthsBetween(U.monthOf(r.from), U.monthOf(U.minDate(r.to, U.maxDate(bounds().hi, r.from))));
    const st = (mo) => { const p = cov.months.find(x => x.month === mo); return p ? (p.status === 'complete' ? 'ok' : 'part') : 'miss'; };
    const chips = months.length <= 14 ? months.map(mo => { const k = st(mo); const p = cov.months.find(x => x.month === mo); return h('span', { class: 'mc ' + k, title: mo + (k === 'ok' ? ' 完整' : k === 'part' ? ' 部分覆盖 ' + p.from + ' 至 ' + p.to : ' 缺账') }, (+mo.slice(5)) + '月', k === 'ok' ? null : h('b', null, k === 'part' ? '仅部分覆盖' : '缺账')); }) : [h('span', { class: 'mc' }, months.length + ' 个月：完整 ' + months.filter(m => st(m) === 'ok').length + '，部分 ' + months.filter(m => st(m) === 'part').length + '，缺账 ' + months.filter(m => st(m) === 'miss').length)];
    const label = cov.none ? '无覆盖记录' : '实际覆盖 ' + cov.from + ' 至 ' + cov.to;
    const allOk = !cov.none && months.length <= 14 && months.every(m => st(m) === 'ok');
    return h('div', { class: 'covstrip', 'aria-label': '覆盖情况：' + label, title: label }, h('span', { class: 'cl' }, label), allOk ? h('span', { class: 'mc ok-all' }, '覆盖完整') : chips);
  }

  function emptyState() {
    return h('div', { class: 'page empty-state' },
      h('header', { class: 'hero-empty' }, h('div', { class: 'he-art', 'aria-hidden': 'true' }), h('div', { class: 'hero-text' }, h('p', { class: 'kicker' }, '离线 · 只存在这台电脑的浏览器里'), h('h1', { class: 'serif' }, '财务档案'), h('p', { class: 'cov' }, '还没有导入数据。'))),
      h('section', { class: 'sect' },
        h('p', null, '点「导入 Excel」选择按 v1.0.0 契约整理的文件；导入前会给出预览，确认后才保存。'),
        h('p', null, '已有备份？点「恢复」选择备份 JSON。'),
        h('p', { class: 'dim' }, '开发样例与正式数据按 dataset_id 分成不同项目，不会自动放入示例交易。'),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'primary', onClick: doImport }, '导入 Excel'), h('button', { type: 'button', onClick: doRestore }, '恢复备份'))));
  }

  function render() {
    renderHeader();
    const main = clear(document.getElementById('main'));
    const banner = document.getElementById('banner');
    clear(banner);
    if (A.isIOS() && !A.standalone() && location.protocol !== 'file:' && !A.st.iosTipClosed) banner.appendChild(h('div', { class: 'banner tip' }, h('b', null, '请先添加到主屏幕再使用：'), '点 Safari 的「共享」→「添加到主屏幕」，之后从主屏幕图标打开、在那里导入数据。这样可以断网使用，数据也不会被 Safari 定期清理。（从主屏幕打开时，数据与 Safari 标签页分开保存。）', h('button', { type: 'button', class: 'x', 'aria-label': '关闭提示', onClick: () => { A.st.iosTipClosed = true; if (A.st.idb) FA.store.setKV('iosTipClosed', true).catch(() => {}); render(); } }, '×')));
    if (A.st.memOnly) banner.appendChild(h('div', { class: 'banner' }, h('b', null, '当前打开方式无法使用本机数据库'), '（' + (A.st.idbError || '') + '）。可以导入查看，但关闭后不会保留。请改用 Edge 或 Chrome 直接打开，或双击「启动本地版.bat」。'));
    const sceneHost = document.getElementById('scene');
    if (!A.st.doc) { sceneHost.hidden = true; main.appendChild(emptyState()); return; }
    sceneHost.hidden = false;
    const prevPage = A._lastPage; A._lastPage = A.st.page;
    FA.scene.setPage(A.st.page, prevPage != null && prevPage !== A.st.page);
    try { main.appendChild(FA.pages[A.st.page](A)); }
    catch (e) { console.error(e); main.appendChild(h('p', { class: 'warn' }, '页面渲染出错：' + (e && e.message || e))); }
    if (prevPage !== A.st.page && !A.reduced()) { main.classList.remove('turn'); void main.offsetWidth; main.classList.add('turn'); }
    if (A._coin && A.st.page === 'overview') { A._coin = false; setTimeout(() => FA.scene.coin(document.querySelector('#fig-balance .amt')), 500); }
    document.title = '财务档案 · ' + A.periodLabel();
  }
  A.render = render;

  async function boot() {
    const res = await FA.store.open();
    A.st.idb = res.ok; A.st.memOnly = !res.ok; A.st.idbError = res.error;
    if (!res.ok) A.st.memDocs = {};
    await refreshIndex();
    if (A.st.idb) { A.st.lastBackup = await FA.store.getKV('lastBackup'); const cur = await FA.store.getKV('current'); const id = A.st.index.some(m => m.dataset_id === cur) ? cur : (A.st.index[0] && A.st.index[0].dataset_id); if (id) await loadDataset(id); }
    const ui = A.st.idb ? (await FA.store.getKV('ui')) || {} : {}; A.st.reduceMotion = !!ui.reduceMotion; applyMotion();
    if (A.st.idb) A.st.iosTipClosed = !!(await FA.store.getKV('iosTipClosed'));
    if (mq && mq.addEventListener) mq.addEventListener('change', () => { applyMotion(); FA.scene.layout(false); });
    document.getElementById('scene').appendChild(FA.scene.build((p, ctx) => A.go(p, ctx)));
    const hash = location.hash.slice(1); if (PAGES.some(p => p[0] === hash)) A.st.page = hash;
    A._coin = true;
    // 跨过窄屏断点或图表可用宽度明显变化（如 iPad 转屏）时重画，并保持滚动位置
    let wasNarrow = window.innerWidth < 700, lastW = FA.charts2.autoW(), rt = 0;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
      const n = window.innerWidth < 700, w = FA.charts2.autoW();
      if (A.st.doc && !document.querySelector('.drawer-wrap, .modal-wrap') && (n !== wasNarrow || Math.abs(w - lastW) >= 120)) { wasNarrow = n; lastW = w; const y = window.scrollY; A._lastPage = A.st.page; render(); window.scrollTo(0, y); }
    }, 200); });
    if (chan) chan.onmessage = () => { syncFromStore(); };
    window.addEventListener('focus', () => { syncFromStore(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncFromStore(); });
    render(); FA.scene.intro();
    document.documentElement.dataset.ready = '1';
  }
  window.addEventListener('DOMContentLoaded', boot);
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
